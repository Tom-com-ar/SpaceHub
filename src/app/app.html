<mat-toolbar class="main-toolbar">
  <a routerLink="/home" class="logo-link">
    <span class="logo-mark">
      <mat-icon>rocket</mat-icon>
    </span>
    <span class="logo-text">
      <span class="logo-title">{{ title }}</span>
      <span class="logo-sub">MISSION CONTROL</span>
    </span>
  </a>

  <span class="spacer"></span>

  <nav>
    <a mat-button routerLink="/home" routerLinkActive="active">
      <mat-icon>home</mat-icon>
      Inicio
    </a>
    <a mat-button routerLink="/dashboard" routerLinkActive="active">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </a>
    <a mat-button routerLink="/trajectory" routerLinkActive="active">
      <mat-icon>orbit</mat-icon>
      Trayectoria
    </a>
    <a mat-button routerLink="/astronauts" routerLinkActive="active">
      <mat-icon>groups</mat-icon>
      Astronautas
    </a>
    <a mat-button routerLink="/launch-history" routerLinkActive="active">
      <mat-icon>history</mat-icon>
      Historial
    </a>
    <a mat-button routerLink="/chat-control" routerLinkActive="active">
      <mat-icon>forum</mat-icon>
      Chat
    </a>
  </nav>

  <span class="spacer"></span>

  <div class="met-readout">
    <span class="met-dot"></span>
    <span class="met-label">MET</span>
    <span class="met-value shb-mono">{{ met }}</span>
  </div>
</mat-toolbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<app-alert-list></app-alert-list>
