<div class="dashboard-page">
  <div class="page-header">
    <div class="header-icon">
      <mat-icon>dashboard</mat-icon>
    </div>
    <div>
      <h1>Dashboard de Misiones</h1>
      <p>Panel de control central</p>
    </div>
  </div>

  <div class="stats-row">
    <mat-card class="stat-card active-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>rocket</mat-icon>
        </div>
        <div class="stat-info">
          <span class="stat-number">{{ activeCount$ | async }}</span>
          <span class="stat-label">Misiones Activas</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card completed-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>check_circle</mat-icon>
        </div>
        <div class="stat-info">
          <span class="stat-number">{{ completedCount$ | async }}</span>
          <span class="stat-label">Completadas</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card failed-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>error</mat-icon>
        </div>
        <div class="stat-info">
          <span class="stat-number">{{ failedCount$ | async }}</span>
          <span class="stat-label">Fallidas</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <h2>Misiones</h2>

  <div class="missions-grid">
    <app-mission-card
      *ngFor="let mission of missions$ | async; trackBy: trackByMissionId"
      [mission]="mission">
    </app-mission-card>
  </div>
</div>
