<div class="chat-page">
  <div class="page-header">
    <div class="header-icon">
      <mat-icon>forum</mat-icon>
    </div>
    <div>
      <h1>Chat de Control</h1>
      <p>Bitácora de comunicaciones con la sala de control</p>
    </div>
  </div>

  <mat-card class="chat-card shb-hud-corners">
    <div class="messages" #messagesContainer>
      <div
        *ngFor="let msg of messages; trackBy: trackByMessageId"
        class="message-row"
        [ngClass]="msg.sender"
      >
        <span class="line-time">[{{ msg.timestamp | date: 'HH:mm:ss' }}]</span>
        <span class="line-tag">{{ msg.sender === 'control' ? 'CONTROL' : msg.sender === 'usuario' ? 'VOS' : 'SISTEMA' }}</span>
        <span class="line-text">{{ msg.text }}</span>
      </div>
      <div #scrollAnchor></div>
    </div>

    <div class="chat-input">
      <span class="prompt-glyph">&gt;</span>
      <mat-form-field appearance="outline" class="input-field">
        <input
          matInput
          [(ngModel)]="draft"
          (keyup.enter)="send()"
          placeholder='Escribí un mensaje o comando ("status", "help")'
        />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="send()">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </mat-card>
</div>
