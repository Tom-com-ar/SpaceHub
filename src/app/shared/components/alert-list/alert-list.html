<div class="alerts-dock" *ngIf="alerts.length">
  <div class="alerts-dock-header shb-eyebrow">
    <span class="dock-dot"></span>
    Alertas activas
  </div>

  <div *ngFor="let alert of alerts"
       class="alert-item shb-hud-corners"
       [ngClass]="{
         'alert-info': alert.type === 'info',
         'alert-warning': alert.type === 'warning',
         'alert-danger': alert.type === 'danger'
       }">
    <span class="alert-icon">
      <mat-icon *ngIf="alert.type === 'info'">info</mat-icon>
      <mat-icon *ngIf="alert.type === 'warning'">warning</mat-icon>
      <mat-icon *ngIf="alert.type === 'danger'">error</mat-icon>
    </span>
    <div class="alert-body">
      <span class="alert-message">{{ alert.message }}</span>
      <span class="alert-time shb-mono">{{ alert.timestamp | date:'HH:mm:ss' }}</span>
    </div>
  </div>
</div>
