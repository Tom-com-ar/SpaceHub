<div class="dashboard-container">
  <h1>Dashboard de Misiones</h1>

  <div class="stats-row">
    <mat-card class="stat-card active">
      <mat-card-content>
        <mat-icon>rocket</mat-icon>
        <div class="stat-info">
          <span class="stat-number">{{ activeMissions }}</span>
          <span class="stat-label">Misiones Activas</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card completed">
      <mat-card-content>
        <mat-icon>check_circle</mat-icon>
        <div class="stat-info">
          <span class="stat-number">{{ completedMissions }}</span>
          <span class="stat-label">Completadas</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card failed">
      <mat-card-content>
        <mat-icon>error</mat-icon>
        <div class="stat-info">
          <span class="stat-number">{{ failedMissions }}</span>
          <span class="stat-label">Fallidas</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <h2>Misiones</h2>

  <div class="missions-grid">
    <app-mission-card
      *ngFor="let mission of missions"
      [mission]="mission">
    </app-mission-card>
  </div>
</div>
